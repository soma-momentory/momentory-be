spring:
  application:
    name: momentory-be
  jackson:
    time-zone: ${app.time-zone}
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

app:
  time-zone: Asia/Seoul

jwt:
  issuer: momentory-api
  audience: momentory-app
  access-token-expiration: 30m
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  secret: ${JWT_SECRET}

kakao:
  api:
    base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    app-id: ${KAKAO_APP_ID}
    admin-key: ${KAKAO_ADMIN_KEY}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_READ_TIMEOUT:5s}

apple:
  auth:
    jwk-set-uri: ${APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
    issuer: ${APPLE_ISSUER:https://appleid.apple.com}
    # iOS 앱 번들 ID. identity token 의 aud 와 대조한다.
    # 비밀이 아니라 **공개 식별자**다(앱 바이너리·스토어에 그대로 있다) — 위 jwk-set-uri·
    # issuer 와 같은 등급이라 기본값을 둔다. 다른 번들 ID로 띄울 때만 환경변수로 덮는다.
    client-id: ${APPLE_CLIENT_ID:kr.momentory.app}
    connect-timeout: ${APPLE_CONNECT_TIMEOUT:3s}
    read-timeout: ${APPLE_READ_TIMEOUT:5s}
    token-uri: ${APPLE_TOKEN_URI:https://appleid.apple.com/auth/token}
    revoke-uri: ${APPLE_REVOKE_URI:https://appleid.apple.com/auth/revoke}
    # 아래 셋은 **탈퇴 시 연결 해제에만** 쓴다. 비어 있어도 앱은 뜨고 로그인도 된다 —
    # 탈퇴만 막힌다. 발급 전인 값을 필수로 걸면 배포가 통째로 막히기 때문이다.
    # team-id·key-id 는 공개 식별자이고, private-key(.p8 내용)만 비밀이다.
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}

google:
  auth:
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    # 구글은 iss 를 스킴 있는 형태와 없는 형태로 모두 발급한다. 하나만 받으면
    # 어느 날 절반이 거절되므로 둘 다 둔다(GoogleIdTokenVerifier 머리말).
    issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}
    # 받아들일 aud — 우리 프로젝트의 클라이언트 ID 전부다. 플랫폼마다 다른 값이
    # 앉는다: Android 는 웹 클라이언트, iOS 는 iOS 클라이언트.
    #
    # ⚠ **Android 는 서명 지문마다 클라이언트가 따로다.** 구글은 Android 앱을
    # 패키지명 + SHA-1 로 알아보므로 지문 하나당 클라이언트 하나가 생기고, 그 값이
    # 토큰의 `azp` 에 앉는다 — `requireOurClient` 가 aud 뿐 아니라 azp 도 이 목록과
    # 대조하기 때문에(GoogleIdTokenVerifier 「nonce 가 없다」), 지문이 빠지면
    # **그 키로 서명된 빌드에서만** CLIENT_ID_MISMATCH 로 닫힌다. 2026-08-26 에
    # 실제로 그렇게 막혔다: debug 만 있던 목록에 release 빌드가 부딪혔고, 카카오는
    # 이 검증을 지나지 않아 멀쩡해서 원인이 앱에 있는 것처럼 보였다.
    #
    # 그래서 Android 는 셋이다 — debug · 업로드 키 · Play 앱 서명.
    # 새 지문(새 키스토어·키 재설정)을 만들면 여기도 함께 늘린다.
    #
    # 애플 client-id 와 같은 등급의 **공개 식별자**다(앱 바이너리에 그대로 있다) —
    # 그래서 기본값을 둔다. 발급 전인 값을 필수로 걸면 배포가 통째로 막힌다.
    allowed-audiences: ${GOOGLE_ALLOWED_AUDIENCES:719283265966-q0sbodjlssdou6g9jla0qfs2j1mbi972.apps.googleusercontent.com,719283265966-s6jo83of0u5jno0n7nsqell72ao0tglm.apps.googleusercontent.com,719283265966-sbcn188a2mhoqv1f0pt54s6dnjde6of1.apps.googleusercontent.com,719283265966-8ali2jjss29dqkrkfp8ajps4co83mars.apps.googleusercontent.com,719283265966-56os4edgbpkar5dh3p1j7l7kv4imv3v6.apps.googleusercontent.com}
    connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:3s}
    read-timeout: ${GOOGLE_READ_TIMEOUT:5s}

gemini:
  api:
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    temperature: ${GEMINI_TEMPERATURE:0.7}
    connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
    read-timeout: ${GEMINI_READ_TIMEOUT:30s}
    # 행동 카드 '상황' 임베딩 모델. gemini-embedding-001 을 outputDimensionality=768 로 잘라
    # action_cards.situation_embedding vector(768) 에 맞춘다(GeminiSituationEmbedder).
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# 턴 판단 모델(TypeSafe Jev). 키가 비어 있으면 판단을 하지 않는다. 모델은 별칭이 아닌 고정 버전을 쓴다 —
# 판단 기록을 버전별로 비교해야 한다. 판단은 매 턴 문장 생성 앞에 끼어들므로 read-timeout 이 짧다.
typesafe:
  api:
    base-url: ${TYPESAFE_API_BASE_URL:https://api.typesafe.ai}
    api-key: ${TYPESAFE_API_KEY:}
    model: ${TYPESAFE_MODEL:jev-1.14.0}
    connect-timeout: ${TYPESAFE_CONNECT_TIMEOUT:2s}
    read-timeout: ${TYPESAFE_READ_TIMEOUT:3s}

momentory:
  judge:
    # 턴 판단을 켤 사용자 id 목록(쉼표 구분). 비어 있으면 아무에게도 켜지 않는다.
    # 대화 원문이 TypeSafe 로 나가므로, 처리위탁 고지 전에는 테스트 계정과 동의한 참여자만 넣는다.
    user-ids: ${TURN_JUDGE_USER_IDS:}
  strategy:
    # 판단으로 바바의 응답 방식(전략)까지 바꿀 사용자 id 목록(쉼표 구분). 여기 있으면 턴 판단도 함께 켜진다.
    user-ids: ${TURN_STRATEGY_USER_IDS:}
    # 아래 기준값은 근거가 쌓이기 전의 임시값이다. 바꾸면 그 전후 대화를 같은 조건으로 볼 수 없다.
    min-confidence: ${TURN_STRATEGY_MIN_CONFIDENCE:0.5}
    close-confidence: ${TURN_STRATEGY_CLOSE_CONFIDENCE:0.8}
    resistance-threshold: ${TURN_STRATEGY_RESISTANCE_THRESHOLD:2}
    # 대화 분량 — 턴 수로 끊지 않고 전략이 마무리를 제안한다. 바바의 질문이 question-cap 에 닿으면 더 묻지 않고,
    # max-turns 는 끝없이 이어지지 않게 하는 안전 상한이다. 둘 다 근거가 쌓이기 전의 임시값이다.
    question-cap: ${TURN_STRATEGY_QUESTION_CAP:8}
    max-turns: ${TURN_STRATEGY_MAX_TURNS:12}
  gate:
    reask-cap: ${RETRO_REASK_CAP:1}
  prompt:
    history-char-budget: ${RETRO_HISTORY_CHAR_BUDGET:1200}
    # 감정 추출 프롬프트 변형 (모델 비교 계획 §3.5). 경계 세트 20세션에서 감정 Macro F1 만점을
    # 지키면서 강도·시점 손해가 가장 작아 기본값으로 둔다. ⚠ 확정이 아니다 — n=20 에 오류 1건
    # 차이라 통계적 근거가 없다. 본 테스트 세트가 나오면 다시 고른다.
    emotion-variant: ${EMOTION_PROMPT_VARIANT:FEW_SHOT_COMBINED}
  price:
    in-per-million: ${RETRO_PRICE_IN_PER_MILLION:0.10}
    out-per-million: ${RETRO_PRICE_OUT_PER_MILLION:0.40}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 앱에서 계산한 백분위수만 보낸다. percentiles-histogram 은 버킷마다 시계열이 생겨
      # Grafana Cloud 무료 한도(활성 시계열 1만)에 닿는다.
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        http.client.requests: 0.5, 0.95, 0.99
  otlp:
    metrics:
      export:
        # dev 작업 정의도 prod 프로필을 쓰므로 프로필이 아니라 환경 변수로 켠다(운영 작업 정의만 true).
        enabled: ${GRAFANA_OTLP_ENABLED:false}
        url: ${GRAFANA_OTLP_URL:http://localhost:4318/v1/metrics}
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH:}
        base-time-unit: seconds
