spring:
  application:
    name: momentory-be
  jackson:
    time-zone: ${app.time-zone}
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

app:
  time-zone: Asia/Seoul

jwt:
  issuer: momentory-api
  audience: momentory-app
  access-token-expiration: 30m
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  secret: ${JWT_SECRET}

kakao:
  api:
    base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    app-id: ${KAKAO_APP_ID}
    admin-key: ${KAKAO_ADMIN_KEY}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_READ_TIMEOUT:5s}

apple:
  auth:
    jwk-set-uri: ${APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
    issuer: ${APPLE_ISSUER:https://appleid.apple.com}
    # iOS 앱 번들 ID. identity token 의 aud 와 대조한다.
    # 비밀이 아니라 **공개 식별자**다(앱 바이너리·스토어에 그대로 있다) — 위 jwk-set-uri·
    # issuer 와 같은 등급이라 기본값을 둔다. 다른 번들 ID로 띄울 때만 환경변수로 덮는다.
    client-id: ${APPLE_CLIENT_ID:kr.momentory.app}
    connect-timeout: ${APPLE_CONNECT_TIMEOUT:3s}
    read-timeout: ${APPLE_READ_TIMEOUT:5s}
    token-uri: ${APPLE_TOKEN_URI:https://appleid.apple.com/auth/token}
    revoke-uri: ${APPLE_REVOKE_URI:https://appleid.apple.com/auth/revoke}
    # 아래 셋은 **탈퇴 시 연결 해제에만** 쓴다. 비어 있어도 앱은 뜨고 로그인도 된다 —
    # 탈퇴만 막힌다. 발급 전인 값을 필수로 걸면 배포가 통째로 막히기 때문이다.
    # team-id·key-id 는 공개 식별자이고, private-key(.p8 내용)만 비밀이다.
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}

google:
  auth:
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    # 구글은 iss 를 스킴 있는 형태와 없는 형태로 모두 발급한다. 하나만 받으면
    # 어느 날 절반이 거절되므로 둘 다 둔다(GoogleIdTokenVerifier 머리말).
    issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}
    # 받아들일 aud — 우리 프로젝트의 클라이언트 ID 전부다. 플랫폼마다 다른 값이
    # 앉는다: Android 는 웹 클라이언트, iOS 는 iOS 클라이언트.
    #
    # 애플 client-id 와 같은 등급의 **공개 식별자**다(앱 바이너리에 그대로 있다) —
    # 그래서 기본값을 둔다. 발급 전인 값을 필수로 걸면 배포가 통째로 막힌다.
    allowed-audiences: ${GOOGLE_ALLOWED_AUDIENCES:719283265966-q0sbodjlssdou6g9jla0qfs2j1mbi972.apps.googleusercontent.com,719283265966-s6jo83of0u5jno0n7nsqell72ao0tglm.apps.googleusercontent.com,719283265966-sbcn188a2mhoqv1f0pt54s6dnjde6of1.apps.googleusercontent.com}
    connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:3s}
    read-timeout: ${GOOGLE_READ_TIMEOUT:5s}

gemini:
  api:
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    temperature: ${GEMINI_TEMPERATURE:0.7}
    connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
    read-timeout: ${GEMINI_READ_TIMEOUT:30s}
    # 행동 카드 '상황' 임베딩 모델. gemini-embedding-001 을 outputDimensionality=768 로 잘라
    # action_cards.situation_embedding vector(768) 에 맞춘다(GeminiSituationEmbedder).
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

momentory:
  gate:
    reask-cap: ${RETRO_REASK_CAP:1}
  prompt:
    history-char-budget: ${RETRO_HISTORY_CHAR_BUDGET:1200}
  price:
    in-per-million: ${RETRO_PRICE_IN_PER_MILLION:0.10}
    out-per-million: ${RETRO_PRICE_OUT_PER_MILLION:0.40}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
