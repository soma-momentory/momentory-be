spring:
  application:
    name: momentory-be
  jackson:
    time-zone: ${app.time-zone}
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

app:
  time-zone: Asia/Seoul

jwt:
  issuer: momentory-api
  audience: momentory-app
  access-token-expiration: 30m
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  secret: ${JWT_SECRET}

kakao:
  api:
    base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    app-id: ${KAKAO_APP_ID}
    admin-key: ${KAKAO_ADMIN_KEY}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_READ_TIMEOUT:5s}

apple:
  auth:
    jwk-set-uri: ${APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
    issuer: ${APPLE_ISSUER:https://appleid.apple.com}
    # iOS 앱 번들 ID. identity token 의 aud 와 대조한다.
    # 비밀이 아니라 **공개 식별자**다(앱 바이너리·스토어에 그대로 있다) — 위 jwk-set-uri·
    # issuer 와 같은 등급이라 기본값을 둔다. 다른 번들 ID로 띄울 때만 환경변수로 덮는다.
    client-id: ${APPLE_CLIENT_ID:kr.momentory.app}
    connect-timeout: ${APPLE_CONNECT_TIMEOUT:3s}
    read-timeout: ${APPLE_READ_TIMEOUT:5s}

gemini:
  api:
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    temperature: ${GEMINI_TEMPERATURE:0.7}
    connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
    read-timeout: ${GEMINI_READ_TIMEOUT:30s}
    # 행동 카드 '상황' 임베딩 모델. gemini-embedding-001 을 outputDimensionality=768 로 잘라
    # action_cards.situation_embedding vector(768) 에 맞춘다(GeminiSituationEmbedder).
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

momentory:
  gate:
    reask-cap: ${RETRO_REASK_CAP:1}
  prompt:
    history-char-budget: ${RETRO_HISTORY_CHAR_BUDGET:1200}
  price:
    in-per-million: ${RETRO_PRICE_IN_PER_MILLION:0.10}
    out-per-million: ${RETRO_PRICE_OUT_PER_MILLION:0.40}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
