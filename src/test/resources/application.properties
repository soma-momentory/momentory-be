# 테스트 컨텍스트용 더미 Gemini 키 — GeminiApiProperties(@NotBlank api-key) 검증을 통과시켜
# 스프링 컨텍스트가 뜨게 한다. 실제 호출은 하지 않거나(Mock), opt-in 통합 테스트에서만
# 진짜 키로 대체한다. 이 파일은 application.yml 을 가리지 않고 보완한다(파일명이 달라서).
gemini.api.api-key=test-gemini-key
kakao.api.admin-key=test-kakao-admin-key
# 테스트 컨텍스트용 더미 애플 클라이언트 ID — AppleAuthProperties(@NotBlank client-id) 검증 통과용.
apple.auth.client-id=com.momentory.test
# 턴 판단 · 전략 선택은 테스트에서 기본으로 꺼 둔다 — 개발자 셸의 TURN_JUDGE_USER_IDS · TURN_STRATEGY_USER_IDS ·
# TYPESAFE_API_KEY 가 테스트에 새어 들어와 대화 흐름을 바꾸거나 외부 판단 모델을 부르지 않게 한다.
# 켜야 하는 테스트는 대상 계정을 직접 지정하고 판단 포트를 대역으로 바꾼다.
momentory.judge.user-ids=
momentory.strategy.user-ids=
typesafe.api.api-key=
momentory.disposition.apply-mode=OFF
momentory.strategy.all-users=false
