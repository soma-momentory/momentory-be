name: CD

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: string

  # Parameter Store 값만 바꾼 뒤
  # 코드 변경 없이 수동 재배포할 때 사용
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >-
      (inputs.environment == 'development' && github.ref_name == 'dev') ||
      (inputs.environment == 'production' && github.ref_name == 'main')
    name: Build and deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-deploy-${{ inputs.environment }}
      cancel-in-progress: false

    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://api.momentory.co.kr' || 'https://dev.momentory.co.kr' }}

    env:
      DEPLOY_SHA: ${{ github.sha }}
      ECS_TASK_DEFINITION: ${{ inputs.environment == 'production' && 'ecs-task-definition.json' || 'ecs-task-definition-dev.json' }}
      ECS_SERVICE: ${{ inputs.environment == 'production' && vars.ECS_SERVICE || vars.ECS_DEV_SERVICE }}
      ECS_CONTAINER_NAME: Main

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail

          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
